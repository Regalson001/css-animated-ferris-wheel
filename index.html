
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="An animated Ferris wheel built with HTML5 and CSS3.">
  <meta name="author" content="Stephen Oyugi">

  <title>Animated Ferris Wheel | Stephen Oyugi</title>

  <link rel="stylesheet" href="./styles.css">
</head>

<body>

  <main class="scene">

    <header class="page-header">
      <p class="eyebrow">CSS Animation Project</p>
      <h1>Animated Ferris Wheel</h1>
      <p class="subtitle">
        A rotating attraction powered entirely by HTML and CSS.
      </p>
    </header>

    <section class="wheel-container" aria-label="Animated Ferris wheel">

      <div class="wheel">

        <!-- Ferris Wheel Spokes -->
        <span class="line"></span>
        <span class="line"></span>
        <span class="line"></span>
        <span class="line"></span>
        <span class="line"></span>
        <span class="line"></span>

        <!-- Ferris Wheel Cabins -->
        <div class="cabin"></div>
        <div class="cabin"></div>
        <div class="cabin"></div>
        <div class="cabin"></div>
        <div class="cabin"></div>
        <div class="cabin"></div>

        <!-- Centre Hub -->
        <div class="hub"></div>

      </div>

      <!-- Support Structure -->
      <div class="support">
        <span class="support-leg support-left"></span>
        <span class="support-leg support-right"></span>
      </div>

      <div class="ground"></div>

    </section>

    <footer class="page-footer">
      <p>Designed and developed by <strong>Stephen Oyugi</strong></p>
      <p>HTML5 · CSS3 · Keyframe Animations</p>
    </footer>

  </main>

</body>
</html>
